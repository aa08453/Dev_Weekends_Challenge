<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My calculator</title>
</head>
<body>
<main class="calculator-container">
  <section class="inputs">
    <div>
      <label for="bill">Bill Amount ($)</label>
      <input type="number" id="bill" min="0.01" step="0.01" placeholder="0.00">
      <span id="bill-error" class="error-msg"></span>
    </div>

    <div>
      <label>Tip Percentage</label>
      <div class="preset-buttons">
        <button type="button" class="preset-btn" data-pct="10">10%</button>
        <button type="button" class="preset-btn" data-pct="15">15%</button>
        <button type="button" class="preset-btn" data-pct="20">20%</button>
      </div>
      <input type="number" id="custom-tip" min="0" max="100" placeholder="Custom %">
      <span id="tip-error" class="error-msg"></span>
    </div>

    <div>
      <label for="people">Number of People</label>
      <input type="number" id="people" min="1" step="1" value="1">
      <span id="people-error" class="error-msg"></span>
    </div>

    <button id="reset-btn">Reset</button>
  </section>

  <section class="outputs">
    <p>Total Tip: <span id="total-tip">$0.00</span></p>
    <p>Grand Total: <span id="grand-total">$0.00</span></p>
    <p>Per-Person Share: <span id="per-person">$0.00</span></p>
    <p id="remainder-note" class="hidden"></p>
  </section>
</main>
<script src="calculator.js"></script>
  </body>
</html>
